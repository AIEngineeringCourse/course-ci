name: Sync CI results to Notion

# Runs in THIS repo only, so the Notion token never reaches a student repo.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify = check tokens/schema only; dry-run = print intended writes; live = write to Notion"
        type: choice
        default: verify        # safe default: a bare dispatch never writes
        options: [verify, dry-run, live]
  # Enabled 2026-08-19, after verify and dry-run both passed against the live
  # workspace. A scheduled run supplies no inputs, so MODE falls back to 'live'
  # and this writes to Notion - that is intended here.
  schedule:
    - cron: "0 7,15 * * 1-5"   # twice each weekday, before your review sessions

concurrency:
  group: notion-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync
        env:
          GITHUB_TOKEN: ${{ secrets.COURSE_READ_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_STUDENTS_DB: ${{ secrets.NOTION_STUDENTS_DB }}
          NOTION_ASSIGNMENTS_DB: ${{ secrets.NOTION_ASSIGNMENTS_DB }}
          # Via env, never interpolated straight into the shell.
          # A scheduled run has no inputs, so MODE falls back to live.
          MODE: ${{ inputs.mode || 'live' }}
          ORG: ${{ github.repository_owner }}
        run: |
          case "$MODE" in
            verify)  python notion_sync.py --verify ;;
            dry-run) python notion_sync.py --org "$ORG" --dry-run ;;
            live)    python notion_sync.py --org "$ORG" ;;
            *) echo "::error::unknown mode: $MODE"; exit 1 ;;
          esac
