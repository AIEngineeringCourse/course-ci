# Per-task manifest for tier-one CI checks.
#
# This is the ONLY file you need to edit when a task changes.
# Keys must match the branch convention: phaseN/taskM  (from phaseN/taskM-slug)
#
# Every task automatically gets: secret scan, .gitignore check, dead-model scan,
# py_compile, and error-only lint. The entries below add the task-specific parts.
#
# Fields:
#   name        human label shown in the PR comment
#   dir_glob    where the work lives (falls back to phaseN/taskM* if omitted)
#   required    files that must exist inside dir_glob (glob patterns)
#   notes       written deliverable check:
#                 file, min_words, min_items, item_label
#   golden_set  dataset validation: file, min_cases, min_per_category
#
# Tasks with no entry still get all the automatic checks — they just skip
# structure/notes/golden-set validation. Adding an entry is always optional.

tasks:

  # ----------------------------------------------------------------- Phase 1
  # TODO(Misha): fill `required` for Phase 1 tasks 1-4 from their Notion pages.
  # Left deliberately loose so nothing fails spuriously before you confirm.
  phase1/task1:
    name: "Ph1 Task 1 — First API calls"
    required: ["*.py"]

  phase1/task2:
    name: "Ph1 Task 2 — Multi-turn chatbot"
    required: ["*.py"]

  phase1/task3:
    name: "Ph1 Task 3 — Prompt engineering"
    required: ["*.py"]

  phase1/task4:
    name: "Ph1 Task 4 — Debug the broken chatbot"
    required: ["*.py"]
    notes:
      # Ph2 Task 3 states its bug count; this one should too (backlog item).
      # Set min_items once you have added the count to the task page.
      file: "bugs.md"
      min_words: 200
      min_items: 3
      item_label: "bug"

  phase1/task5:
    name: "Ph1 Task 5 — Token budget tracker"
    required: ["*.py"]

  # ----------------------------------------------------------------- Phase 2
  # Renumbered 2026-08-28 to match the final Notion ordering. The golden-set
  # rule moved from the old task2 to task4, and the bugs.md rule from the old
  # task3 to task5, because the tasks themselves moved.
  phase2/task1:
    name: "Ph2 Task 1 — LCEL summarizer"
    dir_glob: "phase2/task1_summarizer"
    required:
      - "part_a_summarizer.py"
      - "part_b_structured.py"
      - "comparison.md"
      - "README.md"

  phase2/task2:
    name: "Ph2 Task 2 — Structured output classifier"
    dir_glob: "phase2/task2_structured_output"
    required: ["classify.py", "README.md"]

  phase2/task3:
    name: "Ph2 Task 3 — Chat memory"
    dir_glob: "phase2/task3_chat_memory"
    required: ["chatbot_memory.py", "README.md"]

  phase2/task4:
    name: "Ph2 Task 4 — RAG document Q&A bot"
    dir_glob: "phase2/task4_rag_qa_bot"
    required:
      - "rag_chatbot.py"
      - "ingestion.py"
      - "chain.py"
      - "golden_set.json"
      - "eval.py"
      # Per-task .gitignore, distinct from the repo-root one the gitignore check
      # reads: these tasks ship a local vector store, so the ignore rules live
      # beside the code that produces them. Both files are expected.
      - ".gitignore"
      - "README.md"
    golden_set:
      file: "golden_set.json"
      min_cases: 15
      min_per_category:
        happy_path: 6
        edge_case: 3
        out_of_scope: 3
        ambiguous: 2

  phase2/task5:
    name: "Ph2 Task 5 — Debug the broken RAG pipeline"
    # The task page named no directory, but "anywhere" is not an option: with no
    # matching directory, task detection fails before any file is checked. Fixed
    # on 2026-08-28 by using the same convention as every other Phase 2 task.
    dir_glob: "phase2/task5_rag_debug"
    required: ["rag_fixed.py", "bugs.md"]
    notes:
      file: "bugs.md"
      min_words: 300
      min_items: 5          # the task page states there are 5 seeded bugs
      item_label: "bug"

  phase2/task6:
    name: "Ph2 Task 6 — Multi-document Q&A with citations"
    dir_glob: "phase2/task6_multi_doc_qa"
    required:
      - "qa_bot.py"
      - "ingestion.py"
      - "chain.py"
      - "analysis.md"
      - ".gitignore"
      - "README.md"

  # ----------------------------------------------------------------- Phase 3
  # Verified against each task page, 2026-09-09. Directories are repo-relative.
  # No word-count rules here or in Phase 4: minimums exist on Ph1 T4 and Ph2 T5
  # because thin explanation is the specific failure mode of a debug task.
  # Phase 3/4 analyses are open-ended, where a word floor only rewards padding.
  phase3/task1:
    name: "Ph3 Task 1 — Raw ReAct agent"
    dir_glob: "phase3/task1_raw_react_agent"
    required: ["agent.py", "README.md"]
    # The task page states "No LangChain imports anywhere" as an acceptance
    # criterion: the point is to build the loop on the raw SDK.
    forbidden_imports: ["langchain", "langgraph"]

  phase3/task2:
    name: "Ph3 Task 2 — Tool best practices"
    dir_glob: "phase3/task2_tool_best_practices"
    required: ["agent.py", "analysis.md", "README.md"]

  phase3/task3:
    name: "Ph3 Task 3 — Research agent"
    dir_glob: "phase3/task3_research_agent"
    required: ["agent.py", "graph.png", "README.md"]

  phase3/task4:
    name: "Ph3 Task 4 — Code review agent"
    dir_glob: "phase3/task4_code_review_agent"
    required:
      - "agent.py"
      - "sample_code/buggy_code.py"     # nested path; glob handles the separator
      - "graph.png"
      - "README.md"

  phase3/task5:
    name: "Ph3 Task 5 — Multi-agent pipeline"
    dir_glob: "phase3/task5_multi_agent_pipeline"
    required: ["pipeline.py", "graph.png", "analysis.md", "README.md"]

  phase3/task6:
    name: "Ph3 Task 6 — Human-in-the-loop pipeline"
    dir_glob: "phase3/task6_hitl_pipeline"
    required: ["pipeline.py", "graph.png", "analysis.md", "README.md"]

  # ----------------------------------------------------------------- Phase 4
  phase4/task1:
    name: "Ph4 Task 1 — SSE streaming endpoint"
    dir_glob: "phase4/task1_sse_streaming"
    # viewer.html is optional per the task page and must not be required.
    required: ["server.py", "client.py", "README.md"]

  phase4/task2:
    name: "Ph4 Task 2 — Trace an inefficiency"
    dir_glob: "phase4/task2_trace_inefficiency"
    # Prose only: this task submits no Python. check_compile reports "nothing to
    # compile" as a pass, and ruff over a directory with no .py finds nothing.
    required: ["analysis.md", "trace_links.md", "README.md"]

  phase4/task3:
    name: "Ph4 Task 3 — RAG failure handling"
    dir_glob: "phase4/task3_rag_failure_handling"
    required: ["rag_resilient.py", "test_failures.py", "analysis.md", "README.md"]

  phase4/task4:
    name: "Ph4 Task 4 — Evaluation pipeline"
    dir_glob: "phase4/task4_eval_pipeline"
    required:
      - "audit.md"
      - "golden_dataset_v2.json"
      - "deterministic.py"
      - "retrieval_metrics.py"
      - "judges.py"
      - "run_eval.py"
      - "regression_report.md"
      - "analysis.md"
      - "README.md"
    # Not `golden_set`: that validator expects expected_source to be a filename
    # string, and here it is an object {"source": ..., "page": ...}. Shape only.
    json_shape:
      file: "golden_dataset_v2.json"
      cases_key: "cases"
      min_cases: 20
      string_fields: ["question"]
      object_fields: ["expected_source"]

  # TODO(Misha): phase4/task5 (cost optimization) is EXCLUDED until the
  # duplicate draft of the task page is deleted. Two drafts disagree on the
  # required file set, so any manifest entry would be a guess. Its tasks.json
  # shape check is blocked on the same thing. Restore with:
  #   dir_glob: phase4/task5_cost_optimization
  #   required: cost_tracker.py, agent_instrumented.py, routing.py, caching.py,
  #             tasks.json, cost_report.md, analysis.md, README.md
  # Until then the task falls through to the automatic checks only.

  phase4/task6:
    name: "Ph4 Task 6 — Production service"
    dir_glob: "phase4/task6_production_service"
    required:
      - "app.py"
      - "service.py"
      - "resilience.py"
      - "cost.py"
      - "eval_gate.py"
      - "dashboard.html"
      - "analysis.md"
      - ".gitignore"
      - "README.md"
